# Fallback if the Dockerfile builder is not used. Force the Node provider so
# Nixpacks does not pick Rust because of the Anchor Cargo.toml at the root.
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["cd web && npm ci"]

[phases.build]
cmds = ["cd web && npm run build"]

[start]
cmd = "cd web && npm start"
