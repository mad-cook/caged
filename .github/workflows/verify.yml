name: verifiable build

# Reproducible Docker build of the program (solana-verify), compared against the
# program deployed on mainnet. The binary + hashes are published as a release
# so they can be downloaded without credentials and deployed if the on-chain
# binary was built differently.
on:
  push:
    branches: [main]
    paths: ["programs/**", "Cargo.lock", "Cargo.toml", ".github/workflows/verify.yml"]
  workflow_dispatch:
    inputs:
      program_id:
        description: Program id to compare against
        default: 65cX8gGch8x4vQvU4gnpPcepwKadDSAtJ4ZgZg3hp61t
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROGRAM_ID: ${{ inputs.program_id || '65cX8gGch8x4vQvU4gnpPcepwKadDSAtJ4ZgZg3hp61t' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install solana-verify
        run: cargo install solana-verify --locked

      - name: Reproducible build (Docker, solana 1.18.26 toolchain)
        run: |
          solana-verify build --library-name holder_locker --base-image solanafoundation/solana-verifiable-build:1.18.26
          ls -la target/deploy/holder_locker.so

      - name: Hashes
        run: |
          LOCAL=$(solana-verify get-executable-hash target/deploy/holder_locker.so)
          ONCHAIN=$(solana-verify get-program-hash -u https://api.mainnet-beta.solana.com "$PROGRAM_ID" || echo unavailable)
          echo "local=$LOCAL"
          echo "onchain=$ONCHAIN"
          if [ "$LOCAL" = "$ONCHAIN" ]; then echo "RESULT: MATCH"; else echo "RESULT: MISMATCH"; fi
          printf "commit=%s\nlocal=%s\nonchain=%s\n" "$(git rev-parse HEAD)" "$LOCAL" "$ONCHAIN" > hashes.txt
          cat hashes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: holder_locker-verifiable-${{ github.sha }}
          path: |
            target/deploy/holder_locker.so
            hashes.txt
          if-no-files-found: error

      - name: Publish as release (public download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: verifiable-${{ github.sha }}
          name: verifiable build ${{ github.sha }}
          body: Reproducible build of holder_locker via solana-verify (solana 1.18.26 image). See hashes.txt.
          files: |
            target/deploy/holder_locker.so
            hashes.txt
