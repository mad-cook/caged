name: program tests

on:
  push:
    branches: [main]
    paths: ["programs/**", "tests/**", "Anchor.toml", "Cargo.*", ".github/workflows/test.yml"]
  pull_request:
    paths: ["programs/**", "tests/**", "Anchor.toml", "Cargo.*", ".github/workflows/test.yml"]
  workflow_dispatch:

jobs:
  anchor-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLANA_VERSION: 1.18.26
      ANCHOR_VERSION: 0.30.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-01-30

      - name: Cache cargo + solana
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target
          key: ${{ runner.os }}-anchor-${{ hashFiles('Cargo.lock') }}

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} anchor-cli --locked

      - name: Keypair
        run: solana-keygen new --no-bip39-passphrase --silent -o ~/solana-keypair.json

      - name: Install JS deps
        run: npm ci

      - name: Build
        run: RUSTUP_TOOLCHAIN=nightly-2024-01-30 anchor build

      - name: Test
        run: RUSTUP_TOOLCHAIN=nightly-2024-01-30 anchor test --skip-build
